name: diagnose-review-fixes

on:
  push:
    branches:
      - feat/image-generation-and-user-billing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/image-generation-and-user-billing
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          cat .github/review-fix/patch-*.b64 | base64 --decode | gzip --decompress > /tmp/review-fixes.patch
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and collect diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun run lint:fix 2>&1 | tee /tmp/lint-fix.log
          echo "${PIPESTATUS[0]}" > /tmp/lint-fix.status
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          echo "${PIPESTATUS[0]}" > /tmp/typecheck.status
          bun run lint 2>&1 | tee /tmp/lint.log
          echo "${PIPESTATUS[0]}" > /tmp/lint.status
          bun run test 2>&1 | tee /tmp/test.log
          echo "${PIPESTATUS[0]}" > /tmp/test.status
          bun run build 2>&1 | tee /tmp/build.log
          echo "${PIPESTATUS[0]}" > /tmp/build.status
          exit 0

      - name: Capture validation output
        shell: bash
        run: |
          git diff -- src > /tmp/validated.diff || true
          git status --short > /tmp/status.txt || true

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: review-fix-diagnostics-${{ github.sha }}
          path: |
            /tmp/lint-fix.log
            /tmp/typecheck.log
            /tmp/lint.log
            /tmp/test.log
            /tmp/build.log
            /tmp/*.status
            /tmp/validated.diff
            /tmp/status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Require all validations to pass
        shell: bash
        run: |
          for check in lint-fix typecheck lint test build; do
            status=$(cat "/tmp/${check}.status")
            if [ "$status" != "0" ]; then
              echo "$check failed with status $status"
              exit 1
            fi
          done
