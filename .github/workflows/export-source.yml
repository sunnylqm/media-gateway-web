name: apply-and-validate-review-fixes

on:
  push:
    branches:
      - feat/image-generation-and-user-billing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/image-generation-and-user-billing
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          cat .github/review-fix/patch-*.b64 | base64 --decode | gzip --decompress > /tmp/review-fixes.patch
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format fixes
        run: bun run lint:fix

      - name: Run CI
        shell: bash
        run: |
          set -o pipefail
          bun run ci 2>&1 | tee /tmp/ci.log

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/build.log

      - name: Capture validation output
        if: always()
        shell: bash
        run: |
          git diff -- src > /tmp/validated.diff || true
          git status --short > /tmp/status.txt || true

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-fix-validation-${{ github.sha }}
          path: |
            /tmp/ci.log
            /tmp/build.log
            /tmp/validated.diff
            /tmp/status.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: address media billing review findings'
          git push origin HEAD:feat/image-generation-and-user-billing
