name: apply-validated-review-fixes

on:
  push:
    branches:
      - feat/image-generation-and-user-billing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/image-generation-and-user-billing
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          cat .github/review-fix/patch-*.b64 | base64 --decode | gzip --decompress > /tmp/review-fixes.patch
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/TopupDialog.tsx')
          content = path.read_text()
          first_old = "  useEffect(() => {\n    if (!open) return;"
          first_new = "  const userID = user?.id;\n\n  useEffect(() => {\n    if (!open || !userID) return;"
          second_old = "  }, [open, user?.id]);"
          second_new = "  }, [open, userID]);"
          if content.count(first_old) != 1 or content.count(second_old) != 1:
              raise SystemExit('TopupDialog follow-up context was not found exactly once')
          content = content.replace(first_old, first_new).replace(second_old, second_new)
          path.write_text(content)
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format fixes
        shell: bash
        run: |
          set -o pipefail
          bun run lint:fix 2>&1 | tee /tmp/lint-fix.log

      - name: Run repository CI
        shell: bash
        run: |
          set -o pipefail
          bun run ci 2>&1 | tee /tmp/ci.log

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/build.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-review-fixes-${{ github.sha }}
          path: |
            /tmp/lint-fix.log
            /tmp/ci.log
            /tmp/build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: address media billing review findings'
          git push origin HEAD:feat/image-generation-and-user-billing
