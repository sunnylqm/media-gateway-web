name: studio-ui-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Build with Studio hidden
        run: bun run build
        env:
          VITE_STUDIO_ENABLED: 'false'
      - name: Build with Studio enabled
        run: bun run build
        env:
          VITE_STUDIO_ENABLED: 'true'
      - name: Formatting diagnostics
        if: failure()
        run: |
          bunx biome check --write src/lib/studio src/components/studio src/pages/GuidedStudio.tsx src/main.tsx src/components/Shell.tsx || true
          git diff --binary > studio-format.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-format-diagnostics
          path: studio-format.patch
          retention-days: 3
          if-no-files-found: ignore
