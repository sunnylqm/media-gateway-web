name: studio-ui-ci

on:
  pull_request:
    branches: [main, codex/guided-studio-ui-20260914]

permissions:
  contents: read

concurrency:
  group: studio-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Build with Studio hidden
        run: bun run build
        env:
          VITE_STUDIO_ENABLED: 'false'
      - name: Validate Worker deployment with Studio hidden
        run: |
          test -s dist/index.html
          npx --yes wrangler@4 deploy --dry-run
          npx --yes wrangler@4 versions upload --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Build with Studio enabled
        run: bun run build
        env:
          VITE_STUDIO_ENABLED: 'true'
      - name: Validate Worker deployment with Studio enabled
        run: |
          test -s dist/index.html
          npx --yes wrangler@4 deploy --dry-run
          npx --yes wrangler@4 versions upload --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Save build for browser regression checks
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-build
          path: dist
          retention-days: 3
      - name: Formatting diagnostics
        if: failure()
        run: |
          bunx biome check --write src/lib/sky/g2 src/components/home/PhotographicSky.tsx || true
          git diff --binary > g2-format.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: format-diagnostics
          path: |
            g2-format.patch
            src/lib/sky/g2
            src/components/home/PhotographicSky.tsx
          retention-days: 3
          if-no-files-found: ignore

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [home, flight, presets, generative, g2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio-ui-build
          path: dist
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/home-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/home-browser/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check compiled sky engine
        env:
          SUITE: ${{ matrix.suite }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/home-browser/node_modules/playwright
        run: |
          case "$SUITE" in
            home) node scripts/run-legacy-sky.mjs verify-home.mjs ;;
            flight) node scripts/run-legacy-sky.mjs verify-nebula-flight.mjs ;;
            presets) node scripts/run-legacy-sky.mjs verify-sky-presets.mjs ;;
            generative) node scripts/run-legacy-sky.mjs verify-generative-sky.mjs ;;
            g2) node scripts/verify-g2.mjs ;;
            *) exit 1 ;;
          esac
      - name: Save browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-browser-${{ matrix.suite }}
          path: home-browser-results
          retention-days: 3
          if-no-files-found: ignore
